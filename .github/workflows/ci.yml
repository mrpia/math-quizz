name: CI

# Runs on pull requests (including Dependabot's) and on pushes to main.
# A dependency bump that breaks the build is exactly what this is here to catch:
# PR #2 raised vitest two majors without raising vite, and `pnpm test` could not
# start on main until #5 repaired it.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The app is a static bundle with no backend; CI only ever needs to read.
permissions:
  contents: read

jobs:
  verify:
    name: test + build (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # One leg per LTS line in package.json's `engines`. Keep the two lists
    # identical: `.npmrc` sets engine-strict, so a line missing from `engines`
    # fails install, and a line missing here ships untested.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json's `packageManager` field,
      # so CI and a local checkout cannot drift.
      - uses: pnpm/action-setup@v6

      # A bare major resolves to its latest release, which is what a
      # contributor installing that line today would get.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml is out of step with
      # package.json, rather than quietly resolving something else.
      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # Also type-checks: the build script is `tsc --noEmit && vite build`.
      # Worth keeping separate from the tests — vitest 4 stopped augmenting
      # Vite's config type, which broke `tsc` while every test still passed.
      - run: pnpm build

  # Branch protection on main requires a check named exactly `test + build`,
  # and a matrix renames its legs to `test + build (node 22)` and so on. This
  # job keeps the old name, so the required check still reports and adding a
  # Node line never means editing repo settings.
  #
  # `always()`, not `!cancelled()`: a required check that is skipped counts as
  # passing, so the gate has to run and fail on every outcome but success.
  verify-all:
    name: test + build
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = success

  e2e:
    name: end-to-end (chromium)
    runs-on: ubuntu-latest

    # Deliberately not `needs: verify`. A browser failure and a unit failure are
    # different news, and running them side by side means neither one hides the
    # other behind a skipped job.

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Not in the matrix: Node only builds the bundle and serves it here, and
      # `verify` already builds on every line. The browser is what this job tests.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # setup-node's pnpm cache covers node_modules, never the browser binaries,
      # and those are the slow part — a Chromium download is larger than every
      # dependency in this repo put together. Keyed on the lockfile, so a
      # Playwright bump fetches the matching build instead of reusing the old one.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # The cache holds the browser but not the system libraries it links
      # against, and the runner image is free to change under us.
      - run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # `playwright.config.ts` builds the bundle and serves it with
      # `vite preview` before the first spec runs, so there is no separate
      # build step here.
      - run: pnpm test:e2e

      # The only way to read a failure that did not reproduce locally.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
